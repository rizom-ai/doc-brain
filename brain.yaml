brain: brain
domain: docs.rizom.ai

# Canonical team brain with a public documentation site.
bundles:
  - core
  - site
  - team
anchors:
  - "discord:1442828818493735015"
spaces:
  - "discord:1503073726105915392"

plugins:
  directory-sync:
    seedContent: false
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/doc-brain-content
      branch: main
      authToken: ${GIT_SYNC_TOKEN}
    seedContentPath: ./seed-content
  chat:
    adapters:
      discord:
        botToken: ${DISCORD_BOT_TOKEN}
anchor: team
kind: team
site:
  theme: "@brains/theme-rizom"
