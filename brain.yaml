brain: relay
domain: docs.rizom.ai

# Relay public-site preset plus first-class docs entities.
preset: default
add:
  - docs
anchors:
  - "discord:1442828818493735015"
spaces:
  - "discord:1503073726105915392"

plugins:
  directory-sync:
    seedContent: false
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/doc-brain-content
      branch: main
      authToken: ${GIT_SYNC_TOKEN}
  discord:
    botToken: ${DISCORD_BOT_TOKEN}
