brain: relay
domain: docs.rizom.ai

# Relay public-site preset plus first-class docs entities.
preset: default
add:
  - docs
remove:
  - discord
  - a2a

anchors: []

plugins:
  directory-sync:
    seedContent: false
    autoSync: true
    initialSync: true
    git:
      repo: rizom-ai/doc-brain-content
      branch: main
      authorName: Rizom Docs Bot
      authorEmail: docs@rizom.ai
  mcp:
    authToken: ${MCP_AUTH_TOKEN}
